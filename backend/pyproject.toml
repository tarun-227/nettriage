[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettriage"
version = "0.1.0"
description = "Offline packet-capture diagnoser that separates network faults from attacks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "scapy>=2.5", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
nettriage = "nettriage.cli:main"

[tool.setuptools.packages.find]
include = ["nettriage*"]

[tool.setuptools.package-data]
nettriage = ["static/**/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

